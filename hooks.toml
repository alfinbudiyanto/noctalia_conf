[hooks]
# Start a user unit after Noctalia IPC is ready.
started = "~/.config/noctalia/hooks/startup.sh"
# Combine normal shell commands with Noctalia IPC commands.
session_locked = "~/.config/noctalia/hooks/session-locked.sh"
session_unlocked = "~/.config/noctalia/hooks/session-unlocked.sh"
#logging_out   = "logger -t noctalia-hooks 'logout requested'"
rebooting     = "~/.config/noctalia/hooks/power.sh"
shutting_down = "~/.config/noctalia/hooks/power.sh"

# Log wallpaper changes with the connector-specific payload.
#wallpaper_changed = "logger -t noctalia-hooks \"wallpaper: $NOCTALIA_WALLPAPER_CONNECTOR $NOCTALIA_WALLPAPER_PATH\""
#colors_changed = [
#  "systemctl --user reload foot-server.service",
#  "logger -t noctalia-hooks 'palette colors changed'",
#]
#theme_mode_changed = "logger -t noctalia-hooks \"mode: $NOCTALIA_THEME_MODE\""

# External or IPC-initiated Wi-Fi, Bluetooth, and power profile changes use OSD.
# Use hooks only for extra side effects.
wifi_enabled  = "~/.config/noctalia/hooks/network.sh"
wifi_disabled = "~/.config/noctalia/hooks/network.sh"

bluetooth_enabled  = "~/.config/noctalia/hooks/bluetooth.sh"
bluetooth_disabled = "~/.config/noctalia/hooks/bluetooth.sh"

battery_charging           = "~/.config/noctalia/hooks/battery-charging.sh"
battery_discharging        = "~/.config/noctalia/hooks/battery-discharging.sh"
#battery_plugged            = "logger -t noctalia-hooks 'Battery plugged'"
battery_percentage_changed = "NOCTALIA_BATTERY_THRESHOLD=20 ~/.config/noctalia/hooks/battery-threshold.sh"
power_profile_changed   = "~/.config/noctalia/hooks/power-profile.sh"
