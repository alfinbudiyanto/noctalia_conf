[shell.session]
grid = true
grid_columns = 2

    [[shell.session.actions]]
    action = "command"
    command = "noctalia msg notification-dnd-toggle"
    label = "DND"
    glyph = "bell"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "d"
    variant = "default"

    [[shell.session.actions]]
    action = "command"
    command = "noctalia msg caffeine-toggle"
    label = "Caffeine"
    glyph = "coffee"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "c"
    variant = "secondary"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "outline"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "command"
    command = "reboot"
    label = "Reboot"
    glyph = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "primary"

    [[shell.session.actions]]
    action = "command"
    command = "poweroff"
    label = "Shut Down"
    glyph = "power"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

    [[shell.session.actions]]
    action = "command"
    command = "notify-send -i dialog-warning -t 33333 'HI ALFIN😈' \"All it is about FREEDOM.\\nTo get FREEDOM you need COST!\\nNever FORGET if 'Big money never comes clean'.\\nThe IMPORTANT thing is 'YOU CAN CHEAT IF YOU WANT, BUT DONNOT DRAG ANYONE ELSE DOWN!!!\" && ~/.config/noctalia/hooks/passkey"
    label = "ALFIN"
    glyph = "user"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "0"
    variant = "secondary"